apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/JorgeAsca/FrontEnd-Proyecto.git'
    targetRevision: main # O la rama que uses
    path: k8s # La carpeta donde están los yaml de Kubernetes
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true